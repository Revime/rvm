# =====================================================
#  RVM - Agente de cortes & YPP Gaming Pipeline | configuracao
#  Cumpre 100% das regras de MONETIZATION_GUIDELINE.md
# =====================================================

ia:
  # Qual IA escolhe os melhores trechos: claude | gemini | ollama
  provedor: "ollama"
  modelo_claude: "claude-sonnet-5-5"
  modelo_gemini: "gemini-flash-latest"
  modelo_ollama: "gemma4:e4b"        # modelo instalado localmente no Ollama
  ollama_url: "http://localhost:11434"

cortes:
  quantidade: 5          # quantos cortes gerar por episodio
  duracao_min: 20        # faixa ampla na triagem bruta da IA para nao descartar sugestoes da Ollama (o pipeline YPP ajusta para 35s-55s)
  duracao_max: 90        # maximo aceito na triagem inicial (ajustado em seguida pelo nlp_viral_scorer)
  bloco_minutos: 20      # a transcricao vai para a IA em pedacos deste tamanho
  idioma: "pt"

transcricao:
  # Definido 'small' e 'cpu' para evitar falha/alerta de ausencia de DLLs cuBLAS/cuDNN
  # opcoes: tiny | base | small | medium | large-v3-turbo
  modelo: "small"
  dispositivo: "cpu"       # auto | cpu | cuda

video:
  # desfocado = preserva a area da imagem original sem cortar textos/bordas
  enquadramento: "desfocado"
  dois_rostos: "desfocado"
  fps_max: 60              # YPP Monetization: 60 FPS obrigatorio (Shorts e Long-Form)
  qualidade_crf: 20        # menor = melhor qualidade e arquivo maior (18 a 23)
  preset: "veryfast"

legenda:
  ativar: true
  fonte: "Poppins"         # arquivo .ttf na pasta fontes/
  tamanho: 78              # dimensionado para nunca ultrapassar a area segura de 1080px
  maiusculas: true
  palavras_por_bloco: 2    # 2 palavras por bloco evitam estouro horizontal na tela
  cor: "#FFFFFF"           # Branco para palavras inativas
  cor_destaque: "#FFD700"  # Amarelo Ouro (#FFD700) para enfase de palavra ativa (Secao 5)
  contorno: 8              # Contorno preto pesado (heavy black stroke)
  eixo_y_pct: 0.55         # Centralizado no eixo Y: 55% (juncao do split-screen 55%/45%)

titulo_na_tela:
  ativar: true
  segundos: 0            # 0 = o corte inteiro; ex: 4 = so nos primeiros 4s
  tamanho: 58            # dimensionado com quebra automatica dentro das margens seguras
  cor_texto: "#111111"
  cor_fundo: "#FFFFFF"

credito:
  # DIRETRIZ OBRIGATORIA: Todo corte deve divulgar obrigatoriamente o nome do canal original
  # na tela do video e na descricao para prestar os devidos creditos ao criador original.
  obrigatorio: true
  diretriz: "DIRETRIZ OBRIGATÓRIA DE AUTORIA: É obrigatória em 100% dos cortes a exibição do nome do canal original no vídeo e na descrição, prestando os devidos créditos ao criador original."
  na_tela: true
  texto_tela: "Créditos: {canal}"
  # Texto adicionado obrigatoriamente na descricao de cada post
  na_descricao: "🎥 Créditos ao Criador Original: {canal}\n🔗 Episódio completo: {link}"

youtube:
  # Como os cortes sobem: public (publico) | unlisted (nao listado) | private (privado)
  privacidade: "public"

revisao:
  porta: 5050

# =====================================================
#  MONITORAMENTO DE HARDWARE EM TEMPO REAL (CPU / RAM / GPU)
# =====================================================
monitoramento_hardware:
  ativar: true
  intervalo_segundos: 1.5
  intervalo_log_segundos: 15
  alerta_aviso_pct: 75
  alerta_critico_cpu_pct: 85
  alerta_critico_ram_pct: 85
  alerta_critico_gpu_pct: 90
  alerta_critico_temp_gpu_c: 83
  perguntar_forcar_parada: true


# =====================================================
#  CONSTANTES DE MONETIZACAO YPP (MONETIZATION_GUIDELINE.md)
# =====================================================
monetizacao_ypp:
  nicho: "Gaming (GTA 6 / Rockstar Games)"
  # Limites de tempo e ritmo visual (Secao 4.2 e Secao 7)
  max_static_seconds: 8
  zoom_interval_min_seconds: 4
  zoom_interval_max_seconds: 6
  slow_zoom_factor: 1.12
  punch_in_zoom_factor: 1.15
  broll_min_coverage_ratio: 0.40
  speed_multiplier_shorts: 1.08
  speed_multiplier_min: 1.05
  speed_multiplier_max: 1.10
  silence_threshold_db: -35
  silence_min_duration: 0.35

  # Parametros de audio e narracao TTS (Secao 4.1 e 4.3)
  cold_open_min_seconds: 3.0
  cold_open_max_seconds: 5.0
  intro_bridge_min_seconds: 10.0
  intro_bridge_max_seconds: 15.0
  inter_clip_bridge_min_seconds: 5.0
  inter_clip_bridge_max_seconds: 8.0
  seamless_loop_bridge_seconds: 1.5
  ducking_bg_db: -22
  ducking_en_dub_db: -18
  target_lufs: -14

  # Especificacoes Formato A: YouTube Shorts (Secao 5A)
  shorts:
    width: 1080
    height: 1920
    fps: 60
    min_duration_seconds: 35
    max_duration_seconds: 55
    top_speaker_ratio: 0.55
    bottom_gameplay_ratio: 0.45
    subtitle_y_ratio: 0.55

  # Especificacoes Formato B: Long-Form Compilation (Secao 5B)
  long_form:
    width: 1920
    height: 1080
    fps: 60
    min_duration_seconds: 485
    max_duration_seconds: 720
    min_clips_cluster: 2
    max_clips_cluster: 4
